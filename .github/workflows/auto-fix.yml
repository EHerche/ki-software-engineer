name: Auto-Fix CI Failures with Codex

on:
  workflow_run:
    workflows: ['Build']
    types:
      - completed

jobs:
  auto-fix:
    # Fix failed PR builds and pushes to main from this repository.
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      (
        github.event.workflow_run.event == 'pull_request' ||
        (
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'main'
        )
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Use the SHA from the failed workflow run
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Configure Codex GitHub API access
        env:
          CODEX_CI_HOME: ${{ runner.temp }}/codex-auto-fix
        run: |
          mkdir -p "$CODEX_CI_HOME"
          cat > "$CODEX_CI_HOME/config.toml" <<'EOF'
          [features]
          network_proxy = true

          [permissions.auto-fix]
          extends = ":workspace"

          # The unchanged prompt requires Codex to commit its fixes.
          [permissions.auto-fix.filesystem.":workspace_roots"]
          ".git" = "write"

          [permissions.auto-fix.network]
          enabled = true

          [permissions.auto-fix.network.domains]
          "api.github.com" = "allow"
          "github.com" = "allow"
          "*.blob.core.windows.net" = "allow"
          "registry.npmjs.org" = "allow"
          EOF

      - name: Run Codex Auto-Fix
        uses: openai/codex-action@v1
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          codex-home: ${{ runner.temp }}/codex-auto-fix
          permission-profile: auto-fix
          allow-bot-users: 'github-actions[bot]'
          model: 'gpt-5.6-luna'
          prompt: |
            A CI build has failed. Analyze the errors and fix them automatically.

            **Build Details:**
            - Repository: ${{ github.repository }}
            - Workflow: ${{ github.event.workflow_run.name }}
            - Branch: ${{ github.event.workflow_run.head_branch }}
            - Commit: ${{ github.event.workflow_run.head_sha }}
            - Workflow Run URL: ${{ github.event.workflow_run.html_url }}

            **Your Task:**
            1. Download the workflow logs and analyze the errors
            2. Identify the root causes (build errors, linting problems, tests, etc.)
            3. Perform automatic fixes for:
               - YAML syntax errors in frontmatter
               - TypeScript/JavaScript errors
               - Import/export problems
               - Package.json dependencies
            4. Test the fixes locally with `npm run build`
            5. Commit the changes with a descriptive commit message

            **Important Rules:**
            - Use Conventional Commits standard
            - ALWAYS test with `npm run build` before committing
            - If multiple fixes are needed, create separate commits
            - For critical errors, create an issue instead of auto-fixing

            **Example Commit Messages:**
            - `fix: yaml syntax error in blog frontmatter`
            - `chore: update dependencies to resolve build issues`

            Begin by analyzing the workflow logs!

      - name: Verify fixes with build test
        run: |
          echo "Testing if auto-fixes resolved the build issues..."
          npm run build

      - name: Create Pull Request if changes were made
        if: success()
        run: |
          if [[ -n $(git status --porcelain) ]]; then
            echo "Changes detected, but they should already be committed by Codex"
            echo "Checking if we're on main branch..."
            if [[ $(git branch --show-current) == "main" ]]; then
              echo "Direct commits to main detected"
              git log -1 --pretty=format:"%h - %s (%an)"
            fi
          else
            echo "No uncommitted changes found"
          fi

  notify-failure:
    if: ${{ always() && needs.auto-fix.result == 'failure' }}
    needs: auto-fix
    runs-on: ubuntu-latest
    steps:
      - name: Create issue for failed auto-fix
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🤖 Auto-Fix Failed - Manual Intervention Required',
              body: `## Auto-Fix Error

            The automatic fix for the CI error has failed.

            **Details:**
            - Workflow: ${{ github.event.workflow_run.name }}
            - Branch: ${{ github.event.workflow_run.head_branch }}
            - Commit: ${{ github.event.workflow_run.head_sha }}
            - Auto-Fix Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            - Original Failed Run: ${{ github.event.workflow_run.html_url }}

            Please review the logs and fix the issues manually.`,
              labels: ['bug', 'auto-fix-failed', 'needs-attention']
            })