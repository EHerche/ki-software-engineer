name: Issue Implementation Preparation

on:
  issues:
    types: [labeled]

jobs:
  prepare-implementation:
    if: github.event.label.name == 'ready-for-implementation'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare Feature Branch
        id: prepare-branch
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          BRANCH_NAME="feature/issue-${ISSUE_NUMBER}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH_NAME"
          echo "branch_name=$BRANCH_NAME" >> "$GITHUB_OUTPUT"

      - name: Configure Codex GitHub API access
        env:
          CODEX_CI_HOME: ${{ runner.temp }}/codex-issue-implementation
        run: |
          mkdir -p "$CODEX_CI_HOME"
          cat > "$CODEX_CI_HOME/config.toml" <<'EOF'
          [features]
          network_proxy = true

          [permissions.issue-implementation]
          extends = ":workspace"

          [permissions.issue-implementation.network]
          enabled = true

          [permissions.issue-implementation.network.domains]
          "api.github.com" = "allow"
          EOF

      - name: Implement issue with Codex
        uses: openai/codex-action@v1
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          codex-home: ${{ runner.temp }}/codex-issue-implementation
          permission-profile: issue-implementation
          model: 'gpt-5.6-luna'
          prompt: |
            U/ci-se-green
                                 
               ISSUE_NUMBER=${{ github.event.issue.number }}
               ISSUE_TITLE="${{ github.event.issue.title }}"
               
                                 # Convert to lowercase and replace spaces with hyphens, format: feature/{number}-{title}
               BRANCH_NAME=$(echo "feature/${ISSUE_NUMBER}-${ISSUE_TITLE}" | tr '[:upper:]' '[:lower:]' | sed 's/ /-/g' | sed 's/[^a-z0-9\-\/]//g')

               git config user.name "github-actions[bot]"
               git config user.email "github-actions[bot]@users.noreply.github.com"
