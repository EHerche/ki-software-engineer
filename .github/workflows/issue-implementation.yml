name: Issue Implementation Preparation

on:
  issues:
    types: [labeled]

jobs:
  prepare-implementation:
    if: github.event.label.name == 'ready-for-implementation'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare Feature Branch
        id: prepare-branch
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          BRANCH_NAME="feature/issue-${ISSUE_NUMBER}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH_NAME"
          echo "branch_name=$BRANCH_NAME" >> "$GITHUB_OUTPUT"

      - name: Configure Codex GitHub API access
        env:
          CODEX_CI_HOME: ${{ runner.temp }}/codex-issue-implementation
        run: |
          mkdir -p "$CODEX_CI_HOME"
          cat > "$CODEX_CI_HOME/config.toml" <<'EOF'
          [features]
          network_proxy = true

          [permissions.issue-implementation]
          extends = ":workspace"

          [permissions.issue-implementation.network]
          enabled = true

          [permissions.issue-implementation.network.domains]
          "api.github.com" = "allow"
          "github.com" = "allow"
          EOF

      - name: Implement issue with Codex
        uses: openai/codex-action@v1
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          codex-home: ${{ runner.temp }}/codex-issue-implementation
          permission-profile: issue-implementation
          model: 'gpt-5.6-luna'
          prompt: |
            Use the ci-se-green skill in .codex/skills/ci-se-green/SKILL.md.
            Read and follow that file before making changes.

            REPO: ${{ github.repository }}
            ISSUE_NUMBER: ${{ github.event.issue.number }}
            BRANCH: ${{ steps.prepare-branch.outputs.branch_name }}

            You are already on the feature branch named above.
            Read the current issue and its discussion and verify that
            ready-for-implementation is still present before implementing changes.
            Leave the implementation in the working tree. Do not stage, commit,
            push, modify Git metadata, or create a pull request; the workflow handles
            these operations outside the Codex sandbox. This overrides the skill's
            instructions to commit, push, and create a pull request.
            Do not run tests, builds, or linters, as required by ci-se-green.
            Report changes and blockers accurately; do not claim verification passed.

      - name: Save implementation patch
        if: always()
        run: |
          git add --intent-to-add --all
          git diff --binary HEAD > "$RUNNER_TEMP/implementation.patch"

      - name: Upload implementation patch
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: implementation-patch-${{ github.event.issue.number }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/implementation.patch
          if-no-files-found: warn

      - name: Commit and push implementation
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          BRANCH_NAME: ${{ steps.prepare-branch.outputs.branch_name }}
        run: |
          if [[ "$(git branch --show-current)" != "$BRANCH_NAME" ]]; then
            echo "::error::Unexpected branch; refusing to publish changes."
            exit 1
          fi
          if [[ "$(gh issue view "$ISSUE_NUMBER" --json labels --jq 'any(.labels[]; .name == "ready-for-implementation")')" != "true" ]]; then
            echo "::error::Implementation approval is missing; changes remain in the patch artifact."
            exit 1
          fi
          git add --all
          if git diff --cached --quiet; then
            echo "No implementation changes to commit."
            exit 0
          fi
          git -c core.hooksPath=/dev/null commit -m "Implement issue #${ISSUE_NUMBER}"
          git push origin "HEAD:refs/heads/$BRANCH_NAME"
          echo "published=true" >> "$GITHUB_OUTPUT"

      - name: Create pull request and request review
        if: steps.publish.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          BRANCH_NAME: ${{ steps.prepare-branch.outputs.branch_name }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          PR_URL=$(gh pr list --head "$BRANCH_NAME" --base "$BASE_BRANCH" --state open --json url --jq '.[0].url // empty')
          if [[ -z "$PR_URL" ]]; then
            printf 'Implements #%s.\n\nTests, builds, and linters were not run by ci-se-green. CI verification is pending.\n' "$ISSUE_NUMBER" > "$RUNNER_TEMP/implementation-pr.md"
            PR_URL=$(gh pr create --head "$BRANCH_NAME" --base "$BASE_BRANCH" --title "Implement issue #${ISSUE_NUMBER}" --body-file "$RUNNER_TEMP/implementation-pr.md")
          fi
          ISSUE_AUTHOR=$(gh issue view "$ISSUE_NUMBER" --json author --jq '.author.login')
          gh pr edit "$PR_URL" --add-reviewer "$ISSUE_AUTHOR"
