name: Issue Implementation Preparation

on:
  issues:
    types: [labeled]

jobs:
  prepare-implementation:
    if: github.event.label.name == 'ready-for-implementation'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare Feature Branch
        id: prepare-branch
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          BRANCH_NAME="feature/issue-${ISSUE_NUMBER}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH_NAME"
          echo "branch_name=$BRANCH_NAME" >> "$GITHUB_OUTPUT"

      - name: Configure Codex GitHub API access
        env:
          CODEX_CI_HOME: ${{ runner.temp }}/codex-issue-implementation
        run: |
          mkdir -p "$CODEX_CI_HOME"
          cat > "$CODEX_CI_HOME/config.toml" <<'EOF'
          [features]
          network_proxy = true

          [permissions.issue-implementation]
          extends = ":workspace"

          [permissions.issue-implementation.network]
          enabled = true

          [permissions.issue-implementation.network.domains]
          "api.github.com" = "allow"
          EOF

      - name: Implement issue with Codex
        uses: openai/codex-action@v1
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          codex-home: ${{ runner.temp }}/codex-issue-implementation
          permission-profile: issue-implementation
          prompt: |
            Use the ci-se-green skill in .codex/skills/ci-se-green/SKILL.md.
            Read and follow that file before making changes.

            REPO: ${{ github.repository }}
            ISSUE_NUMBER: ${{ github.event.issue.number }}
            BRANCH: ${{ steps.prepare-branch.outputs.branch_name }}

            You are already on the feature branch named above.
            Read the current issue and its discussion, including the latest analysis.
            Verify that ready-for-implementation is still present before making changes.
            If approval is missing or the skill prerequisites are not met, stop and
            report the blocker without implementing changes.
